plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.remon.thesystem'
    compileSdk 36
    defaultConfig {
        applicationId 'com.remon.thesystem'
        minSdk 28
        targetSdk 36
        versionCode 11020
        versionName '11.2'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.2'
    implementation 'androidx.health.connect:connect-client:1.1.0'
}

// v11.2 restores the feature-rich v10 systems inside the v11 System UI.
tasks.named("preBuild").configure {
    doFirst {
        def source = file('src/main/java/com/remon/thesystem/SystemV11Activity.kt')
