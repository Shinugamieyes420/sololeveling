        val goal = EditText(this).apply { hint = "GOAL"; inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL; setTextColor(Color.WHITE); setHintTextColor(muted); setBackgroundResource(R.drawable.system_input) }
        val unit = EditText(this).apply { hint = "UNIT (min / reps / km / task)"; setTextColor(Color.WHITE); setHintTextColor(muted); setBackgroundResource(R.drawable.system_input) }
        listOf(name, goal, unit).forEach { wrap.addView(it, LinearLayout.LayoutParams(-1, 50.dp).apply { setMargins(0, 4.dp, 0, 4.dp) }) }
        AlertDialog.Builder(this).setTitle("ADD DAILY TASK").setView(wrap)
            .setNegativeButton("CANCEL", null)
            .setPositiveButton("ADD") { _, _ ->
                val taskName = name.text.toString().trim()
                if (taskName.isNotEmpty()) {
                    store.daily.add(V11DailyTask("daily_${System.currentTimeMillis()}", taskName, (goal.text.toString().toDoubleOrNull() ?: 1.0).coerceAtLeast(0.1), 0.0, unit.text.toString().trim().ifBlank { "task" }))
                    store.save(); show("DAILY")
                }
            }.show()
    }

