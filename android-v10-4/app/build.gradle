'''        items.forEach { (id, label) ->
            box.addView(systemButton(label, if (id == screen) green else blue) {
                dialog.dismiss(); show(id)
            }, LinearLayout.LayoutParams(-1, 48.dp).apply { setMargins(0, 3.dp, 0, 3.dp) })
        }
        box.addView(systemButton("RESET PLAYER DATA", red) {
            dialog.dismiss(); confirmReset()
        }, LinearLayout.LayoutParams(-1, 48.dp).apply { setMargins(0, 10.dp, 0, 3.dp) })
        dialog.show()
