    private fun confirmReset() {
        AlertDialog.Builder(this)
            .setTitle("RESET PLAYER DATA?")
            .setMessage("Weet je het zeker? Alle levels, XP, Gold, Hunter Rank, quests, Daily-progress, Gate Keys, inventory, equipment, stats en Job Change worden permanent gewist. Dit kan niet ongedaan worden gemaakt.")
            .setNegativeButton("CANCEL", null)
            .setPositiveButton("RESET EVERYTHING") { _, _ ->
                getSharedPreferences("system_player_v11", android.content.Context.MODE_PRIVATE).edit().clear().commit()
                getSharedPreferences("system_native_v104", android.content.Context.MODE_PRIVATE).edit().clear().commit()
                getSharedPreferences("system_features_v11", android.content.Context.MODE_PRIVATE).edit().clear().commit()
                toast("PLAYER DATA RESET")
                recreate()
            }.show()
    }

    private fun showAwakening() {''')

            text = text.replace(
'''    private fun renderQuests() {
        add(systemTitle("QUEST INFO", "SYSTEM DIRECTIVES"), 3)
        store.quests.forEach { add(questCard(it), 7) }
    }''',
'''    private fun renderQuests() {
        add(systemTitle("QUEST INFO", "SYSTEM DIRECTIVES"), 3)
        add(systemButton("+ CREATE CUSTOM QUEST", green) { createQuestDialog() }, 10)
        store.quests.forEach { add(questCard(it), 7) }
    }

    private fun createQuestDialog() {
        val wrap = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(18.dp, 8.dp, 18.dp, 0) }
        val name = EditText(this).apply { hint = "QUEST NAME"; setTextColor(Color.WHITE); setHintTextColor(muted); setBackgroundResource(R.drawable.system_input) }
        val description = EditText(this).apply { hint = "DESCRIPTION"; setTextColor(Color.WHITE); setHintTextColor(muted); setBackgroundResource(R.drawable.system_input) }
        val minutes = EditText(this).apply { hint = "MINUTES"; inputType = InputType.TYPE_CLASS_NUMBER; setTextColor(Color.WHITE); setHintTextColor(muted); setBackgroundResource(R.drawable.system_input) }
        val xp = EditText(this).apply { hint = "XP REWARD"; inputType = InputType.TYPE_CLASS_NUMBER; setTextColor(Color.WHITE); setHintTextColor(muted); setBackgroundResource(R.drawable.system_input) }
        listOf(name, description, minutes, xp).forEach { wrap.addView(it, LinearLayout.LayoutParams(-1, 50.dp).apply { setMargins(0, 4.dp, 0, 4.dp) }) }
        AlertDialog.Builder(this).setTitle("CREATE QUEST").setView(wrap)
            .setNegativeButton("CANCEL", null)
            .setPositiveButton("CREATE") { _, _ ->
                val questName = name.text.toString().trim()
                if (questName.isNotEmpty()) {
                    val rewardXp = (xp.text.toString().toIntOrNull() ?: 35).coerceIn(5, 250)
                    val rewardGold = (rewardXp * 1.7).toInt().coerceAtLeast(10)
                    store.quests.add(V11Quest("custom_${System.currentTimeMillis()}", questName, description.text.toString().trim(), rewardXp, rewardGold, (minutes.text.toString().toIntOrNull() ?: 30).coerceIn(1, 480), "custom", "vit"))
                    store.save(); show("QUEST")
                }
            }.show()
    }''')

