            text = text.replace(
'''    private fun renderStatus() {''',
'''    private fun renderInventory() {
        add(systemTitle("INVENTORY", "EQUIPMENT MANAGEMENT"), 3)
        val equipped = panel()
        equipped.addView(systemText("EQUIPPED", blue, 10f, true, true))
        listOf("weapon", "armor", "accessory").forEach { slot ->
            val item = features.equippedItem(slot)
            equipped.addView(systemText("${slot.uppercase()}   ${item?.name ?: "NONE"}", if (item == null) muted else Color.WHITE, 12f))
            if (item != null) equipped.addView(systemButton("UNEQUIP ${item.name}", red) { toast(features.unequip(store, slot)); show("INVENTORY") })
        }
        add(equipped, 10)
        add(systemText("OWNED EQUIPMENT", Color.WHITE, 15f, true, true), 6)
        val owned = features.ownedGear()
        if (owned.isEmpty()) add(systemText("No equipment owned yet. Visit the System Shop.", muted, 11f, true))
        owned.forEach { item ->
            val card = panel()
            card.addView(systemText("[${item.rank}] ${item.name}  ×${features.ownedCount(item.id)}", Color.WHITE, 14f, false, true))
            card.addView(systemText("${item.slot.uppercase()}   •   ${item.description}", muted, 10f))
            val actions = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
            actions.addView(systemButton(if (features.equippedId(item.slot) == item.id) "EQUIPPED" else "EQUIP", green) { toast(features.equip(store, item)); show("INVENTORY") }, LinearLayout.LayoutParams(0, 46.dp, 1f).apply { marginEnd = 3.dp })
            actions.addView(systemButton("SELL", gold) { toast(features.sell(store, item)); show("INVENTORY") }, LinearLayout.LayoutParams(0, 46.dp, 1f).apply { marginStart = 3.dp })
            card.addView(actions); add(card, 7)
        }
        val consumables = panel()
        consumables.addView(systemText("CONSUMABLES", blue, 10f, true, true))
        store.consumables.forEach { (name, amount) -> consumables.addView(systemText("$name   ×$amount", Color.WHITE, 11f)) }
