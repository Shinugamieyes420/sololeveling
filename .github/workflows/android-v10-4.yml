name: Export Android APK Toolchain

on:
  push:
    branches: [ android-build-v10-4 ]
  workflow_dispatch:

jobs:
  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Pack minimal Android compiler/signing tools
        run: |
          mkdir -p toolkit/build-tools
          cp "$ANDROID_HOME/platforms/android-35/android.jar" toolkit/android.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt2" toolkit/build-tools/aapt2
          cp "$ANDROID_HOME/build-tools/35.0.0/d8" toolkit/build-tools/d8
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" toolkit/build-tools/apksigner
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" toolkit/build-tools/zipalign
          cp -R "$ANDROID_HOME/build-tools/35.0.0/lib" toolkit/build-tools/lib
          chmod +x toolkit/build-tools/aapt2 toolkit/build-tools/d8 toolkit/build-tools/apksigner toolkit/build-tools/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-toolchain-35
          path: toolkit
          if-no-files-found: error
