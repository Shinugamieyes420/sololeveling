name: Build Android v10.4 APK

on:
  push:
    branches: [ android-build-v10-4 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: android-native-v10-4
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp android-native-v10-4/app/build/outputs/apk/debug/app-debug.apk THE_SYSTEM_v10.4_Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: THE_SYSTEM_v10.4_Android_APK
          path: THE_SYSTEM_v10.4_Android.apk
          if-no-files-found: error
